<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            user-select: none;
        }

        .chart {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .chart-world {
            position: absolute;
            inset: 0;
            transform: scale(1);
            transform-origin: center;
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #000000 1px, rgba(0, 0, 0, 0) 1px);
        }

        .canvas-zoom {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
            font: 13px system-ui, sans-serif;
        }

        .canvas-zoom button {
            min-width: 30px;
            height: 28px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #334155;
            cursor: pointer;
            font: inherit;
        }

        .canvas-zoom button:hover,
        .canvas-zoom button:focus-visible {
            background: #e2e8f0;
            outline: none;
        }

        .canvas-zoom-level {
            min-width: 42px;
            color: #475569;
            text-align: center;
        }

        .simulation-layout {
            --simulation-width: min(420px, 36vw);
            overflow: hidden;
        }

        .simulation-layout .chart {
            position: relative;
            width: calc(100vw - var(--simulation-width));
            height: 100vh;
        }

        .simulation-layout .flow-validation {
            right: calc(var(--simulation-width) + 12px);
        }

        .simulation-layout .diagram-file-tools {
            right: calc(var(--simulation-width) + 58px);
        }

        .flow-validation {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 30;
            font: 13px system-ui, sans-serif;
        }

        .flow-validation-button {
            position: relative;
            display: grid;
            width: 36px;
            height: 36px;
            padding: 8px;
            place-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            color: #64748b;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
            cursor: pointer;
        }

        .flow-validation-button.has-issues {
            border-color: #f59e0b;
            color: #b45309;
        }

        .flow-validation-button svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .flow-validation-count {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 16px;
            padding: 1px 4px;
            border-radius: 999px;
            background: #dc2626;
            color: white;
            font-size: 10px;
            font-weight: 700;
            line-height: 14px;
            text-align: center;
        }

        .flow-validation-panel {
            position: absolute;
            top: 44px;
            right: 0;
            width: min(340px, calc(100vw - 24px));
            max-height: min(60vh, 440px);
            overflow: auto;
            padding: 8px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: #334155;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
        }

        .flow-validation-panel[hidden] {
            display: none;
        }

        .flow-validation-panel ul {
            display: grid;
            gap: 8px;
            margin: 4px 0;
            padding-left: 18px;
        }

        .flow-validation-panel li::marker {
            color: #d97706;
        }

        .flow-validation-panel p {
            margin: 4px 0;
        }

        .diagram-file-tools {
            position: fixed;
            top: 12px;
            right: 58px;
            z-index: 30;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font: 13px system-ui, sans-serif;
        }

        .diagram-file-tools > button,
        .readonly-badge {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            color: #334155;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
            font: inherit;
        }

        .diagram-file-tools > button {
            cursor: pointer;
        }

        .diagram-file-tools > button:hover,
        .diagram-file-tools > button:focus-visible {
            border-color: cornflowerblue;
            outline: none;
        }

        .readonly-badge {
            color: #475569;
        }

        .diagram-file-status {
            position: absolute;
            top: 44px;
            right: 0;
            width: max-content;
            max-width: min(360px, calc(100vw - 24px));
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            color: #334155;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
        }

        .diagram-file-status.error {
            border-color: #fca5a5;
            color: #b91c1c;
        }

        .diagram-file-status[hidden] {
            display: none;
        }

        .simulation-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 25;
            display: flex;
            width: var(--simulation-width, 420px);
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #cbd5e1;
            background: #fff;
            box-shadow: -6px 0 24px rgba(15, 23, 42, 0.1);
            font: 12px system-ui, sans-serif;
        }

        .simulation-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .simulation-controls button {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #334155;
            font: inherit;
            cursor: pointer;
        }

        .simulation-controls button:hover:not(:disabled) {
            border-color: cornflowerblue;
        }

        .simulation-controls button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .simulation-status {
            flex: 0 0 auto;
            min-height: 18px;
            padding: 8px 10px;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            overflow-wrap: anywhere;
        }

        .simulation-status.error {
            color: #b91c1c;
        }

        .simulation-table-wrapper {
            min-height: 0;
            flex: 1;
            overflow: auto;
        }

        .simulation-table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .simulation-table th,
        .simulation-table td {
            padding: 6px 9px;
            border-right: 1px solid rgba(148, 163, 184, 0.35);
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .simulation-table thead {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fafc;
        }

        .simulation-table th:last-child,
        .simulation-table td:last-child {
            border-right: 0;
        }

        .shape.simulation-current {
            outline: 3px solid #f59e0b;
            outline-offset: 3px;
        }

        .link-layer path.simulation-flowline {
            stroke: #f59e0b;
            stroke-width: 3.5;
            filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.65));
        }

        .simulation-input-dialog {
            width: min(380px, calc(100vw - 32px));
            max-width: none;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #0f172a;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.25);
        }

        .simulation-input-dialog::backdrop {
            background: rgba(15, 23, 42, 0.45);
        }

        .simulation-input-dialog form {
            display: grid;
            gap: 14px;
            padding: 20px;
        }

        .simulation-input-dialog h2 {
            margin: 0;
            font: 600 18px system-ui, sans-serif;
        }

        .simulation-input-fields {
            display: grid;
            gap: 12px;
            max-height: min(55vh, 420px);
            overflow-y: auto;
        }

        .simulation-input-dialog label {
            display: grid;
            gap: 7px;
            font: 600 13px system-ui, sans-serif;
        }

        .simulation-input-dialog input {
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: 14px system-ui, sans-serif;
            user-select: text;
        }

        @media (max-width: 760px) {
            .simulation-layout {
                --simulation-width: 100vw;
            }

            .simulation-layout .chart {
                width: 100vw;
                height: 58vh;
            }

            .simulation-layout .simulation-panel {
                top: 58vh;
                width: 100vw;
                border-top: 1px solid #cbd5e1;
                border-left: 0;
            }

            .simulation-layout .flow-validation,
            .simulation-layout .diagram-file-tools {
                top: 8px;
            }

            .simulation-layout .flow-validation {
                right: 8px;
            }

            .simulation-layout .diagram-file-tools {
                right: 54px;
            }
        }

        .read-only #shape-palette,
        .read-only .shape-actions,
        .read-only .handle,
        .read-only .link-handle {
            display: none !important;
        }

        .read-only .link-hit,
        .read-only .link-turn,
        .read-only .link-label {
            pointer-events: none !important;
        }

        .shape {
            position: absolute;
        }

        .content {
            width: 100%;
            height: 100%;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: break-word;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            color: white;
            &:focus {
                outline: none;
            }
        }

        .rectangle {
            background-color: cornflowerblue;
            border-radius: 0;
            padding: 8px;
        }

        .diamond {
            background-color: cornflowerblue;
            border-radius: 0;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            padding: 20px 25%;
        }

        .parallelogram {
            background-color: cornflowerblue;
            border-radius: 0;
            clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
            padding: 8px 10.5%;
        }

        .pill {
            background-color: cornflowerblue;
            border-radius: 999px;
            padding: 8px 10.5%;
        }

        .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            margin: -5px;
            box-sizing: border-box;
            background: white;
            border: 1px solid cornflowerblue;
            opacity: 0;
            touch-action: none;
        }

        .link-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            margin: -9px;
            box-sizing: border-box;
            border: 2px solid cornflowerblue;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            padding: 0;
            touch-action: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .link-handle:hover,
        .link-handle:focus-visible {
            border-color: #f6c945;
            box-shadow: 0 0 0 2px rgba(246, 201, 69, 0.28);
            outline: none;
        }

        .shape-actions {
            position: absolute;
            top: -40px;
            right: -40px;
            z-index: 10;
            display: flex;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .shape.selected .shape-actions {
            opacity: 1;
            pointer-events: auto;
        }

        .shape-action {
            display: grid;
            width: 26px;
            height: 26px;
            padding: 5px;
            place-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #334155;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
            cursor: pointer;
        }

        .shape-action:hover,
        .shape-action:focus-visible {
            border-color: cornflowerblue;
            color: #1d4ed8;
            outline: none;
        }

        .shape-action.delete-shape:hover,
        .shape-action.delete-shape:focus-visible {
            border-color: #ef4444;
            color: #dc2626;
        }

        .shape-action svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .link-label-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .link-label {
            position: absolute;
            transform: translate(-50%, -50%);
            min-width: 20px;
            min-height: 16px;
            padding: 1px 7px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            white-space: nowrap;
            pointer-events: auto;
            outline: none;
            transition: opacity 0.12s ease, border-color 0.12s ease;
        }

        .link-label:empty {
            opacity: 0;
        }

        .link-label:empty::before {
            content: "\2026";
            color: #94a3b8;
        }

        .link-label:empty:hover {
            opacity: 1;
        }

        .link-label:focus {
            opacity: 1;
            border-color: cornflowerblue;
        }

        .link-label:focus:empty::before {
            content: "";
        }

        .shape.selected .handle,
        .shape.selected .link-handle {
            opacity: 1;
        }

        .chart.multi-selection .shape .handle,
        .chart.multi-selection .shape .link-handle,
        .chart.multi-selection .shape .shape-actions {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .n { left: 50%;  top: 0;    cursor: n-resize; }
        .s { left: 50%;  top: 100%; cursor: s-resize; }
        .e { left: 100%; top: 50%;  cursor: e-resize; }
        .w { left: 0;    top: 50%;  cursor: w-resize; }
        .ne { left: 100%; top: 0;    cursor: ne-resize; }
        .nw { left: 0;    top: 0;    cursor: nw-resize; }
        .se { left: 100%; top: 100%; cursor: se-resize; }
        .sw { left: 0;    top: 100%; cursor: sw-resize; }
        .link-handle.n { left: 50%; top: -18px; cursor: pointer; }
        .link-handle.s { left: 50%; top: calc(100% + 18px); cursor: pointer; }
        .link-handle.e { left: calc(100% + 18px); top: 50%; cursor: pointer; }
        .link-handle.w { left: -18px; top: 50%; cursor: pointer; }

        .chart.linking-mode,
        .chart.linking-mode .shape,
        .chart.linking-mode .content {
            cursor: crosshair;
        }

        .shape.linking {
            filter: drop-shadow(0 0 6px rgba(246, 201, 69, 0.95));
        }

        .shape.link-target {
            filter: drop-shadow(0 0 7px rgba(100, 149, 237, 0.95));
        }

        .link-turn {
            fill: white;
            stroke: cornflowerblue;
            stroke-width: 2;
            cursor: pointer;
        }

        .link-turn:hover,
        .link-turn:focus {
            fill: #fef3c7;
            stroke: #d97706;
            outline: none;
        }

        .ghost-path {
            animation: ghost-dash 0.7s linear infinite;
        }

        @keyframes ghost-dash {
            to { stroke-dashoffset: -11; }
        }

        .link-hint {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: none;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            font: 12px system-ui, sans-serif;
            pointer-events: none;
            z-index: 999;
        }

        .link-hint.show {
            display: block;
        }

        .link-picker {
            position: fixed;
            z-index: 1000;
            display: none;
            min-width: 190px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
            font: 13px system-ui, sans-serif;
            color: #0f172a;
        }

        .link-picker.open {
            display: block;
            animation: picker-pop 0.12s ease-out;
        }

        @keyframes picker-pop {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .link-picker-title,
        .link-picker-footer {
            padding: 6px 10px 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
        }

        .link-picker-footer {
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: #94a3b8;
        }

        .link-picker button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .link-picker button:hover,
        .link-picker button:focus-visible {
            background: #eef3fd;
            outline: none;
        }

        .program-editor {
            width: min(640px, calc(100vw - 32px));
            max-width: none;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #0f172a;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.25);
        }

        .program-editor::backdrop {
            background: rgba(15, 23, 42, 0.45);
        }

        .program-editor form {
            display: grid;
            gap: 14px;
            padding: 20px;
        }

        .program-editor h2 {
            margin: 0;
            font: 600 18px system-ui, sans-serif;
        }

        .program-editor label {
            display: grid;
            gap: 7px;
            font: 600 13px system-ui, sans-serif;
        }

        .program-editor textarea {
            min-height: 260px;
            padding: 10px;
            resize: vertical;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            background: #f8fafc;
            font: 13px/1.5 Consolas, monospace;
            user-select: text;
        }

        .program-editor-help {
            margin: -6px 0 0;
            color: #64748b;
            font: 12px/1.4 system-ui, sans-serif;
        }

        .program-editor-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .program-editor-actions button {
            padding: 7px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            cursor: pointer;
        }

        .program-editor-actions button[type="submit"] {
            border-color: cornflowerblue;
            background: cornflowerblue;
            color: #fff;
        }

        .pick-icon {
            flex: none;
            width: 28px;
            height: 20px;
            background: cornflowerblue;
        }

        .pick-icon.process { border-radius: 2px; }
        .pick-icon.decision { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); height: 24px; }
        .pick-icon.io { clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%); }
        .pick-icon.terminator { border-radius: 999px; }

        .cursor-tooltip {
            position: fixed;
            left: 0;
            top: 0;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            font: 600 11px system-ui, sans-serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;
            z-index: 10000;
        }

        .cursor-tooltip.show {
            opacity: 1;
        }

        .selection-box {
            position: absolute;
            display: none;
            box-sizing: border-box;
            border: 1px solid cornflowerblue;
            background: rgba(100, 149, 237, 0.12);
            pointer-events: none;
            z-index: 500;
        }

        .shape.selected {
            filter: drop-shadow(0 0 1px #1d4ed8) drop-shadow(0 0 2px rgba(29, 78, 216, 0.4));
        }

        .chart.linking-mode .link-hit,
        .chart.linking-mode .link-turn {
            pointer-events: none !important;
        }

        .controls {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.5);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .shape-tool {
            position: relative;
            width: 90px;
            min-height: 62px;
            padding: 8px 6px 6px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #fff;
            cursor: grab;
            user-select: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .shape-tool:hover,
        .shape-tool.active {
            border-color: cornflowerblue;
            box-shadow: 0 0 0 2px rgba(100, 149, 237, 0.18);
        }

        .shape-tool:active {
            cursor: grabbing;
        }

        .mini-shape {
            position: relative;
            width: 62px;
            height: 32px;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: cornflowerblue;
            color: white;
            font-size: 9px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0.02em;
            overflow: hidden;
        }

        .mini-shape.process { border-radius: 3px; }
        .mini-shape.decision { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); height: 36px; }
        .mini-shape.io { clip-path: polygon(14% 0%, 100% 0%, 86% 100%, 0% 100%); }
        .mini-shape.terminator { border-radius: 999px; }

        .shape-tool-label {
            display: block;
            text-align: center;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
        }

        .tool-preview {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: translate(-50%, -50%);
        }

        .tool-preview .mini-shape {
            width: 80px;
            height: 40px;
            font-size: 10px;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
        }
    </style>
