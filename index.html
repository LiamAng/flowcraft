<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            user-select: none;
        }

        .chart {
            width: 100vw;
            height: 100vh;
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #000000 1px, rgba(0, 0, 0, 0) 1px);
        }

        .shape {
            position: absolute;
        }

        .content {
            width: 100%;
            height: 100%;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: break-word;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            color: white;
            &:focus {
                outline: none;
            }
        }

        .rectangle {
            background-color: cornflowerblue;
            border-radius: 0;
            padding: 8px;
        }

        .diamond {
            background-color: cornflowerblue;
            border-radius: 0;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            padding: 20px 25%;
        }

        .parallelogram {
            background-color: cornflowerblue;
            border-radius: 0;
            clip-path: polygon(12% 0%, 100% 0%, 88% 100%, 0% 100%);
            padding: 8px 10.5%;
        }

        .pill {
            background-color: cornflowerblue;
            border-radius: 999px;
            padding: 8px 10.5%;
        }

        .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            margin: -5px;
            box-sizing: border-box;
            background: white;
            border: 1px solid cornflowerblue;
            opacity: 0;
            touch-action: none;
        }

        .link-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            margin: -9px;
            box-sizing: border-box;
            border: 2px solid cornflowerblue;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            padding: 0;
            touch-action: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .link-handle:hover,
        .link-handle:focus-visible {
            border-color: #f6c945;
            box-shadow: 0 0 0 2px rgba(246, 201, 69, 0.28);
            outline: none;
        }

        .link-label-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .link-label {
            position: absolute;
            transform: translate(-50%, -50%);
            min-width: 20px;
            min-height: 16px;
            padding: 1px 7px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            white-space: nowrap;
            pointer-events: auto;
            outline: none;
            transition: opacity 0.12s ease, border-color 0.12s ease;
        }

        .link-label:empty {
            opacity: 0;
        }

        .link-label:empty::before {
            content: "\2026";
            color: #94a3b8;
        }

        .link-label:empty:hover {
            opacity: 1;
        }

        .link-label:focus {
            opacity: 1;
            border-color: cornflowerblue;
        }

        .link-label:focus:empty::before {
            content: "";
        }

        .shape:hover .handle,
        .shape:focus-within .handle,
        .shape.dragging .handle,
        .shape:hover .link-handle,
        .shape:focus-within .link-handle,
        .shape.dragging .link-handle {
            opacity: 1;
        }
        .n { left: 50%;  top: 0;    cursor: n-resize; }
        .s { left: 50%;  top: 100%; cursor: s-resize; }
        .e { left: 100%; top: 50%;  cursor: e-resize; }
        .w { left: 0;    top: 50%;  cursor: w-resize; }
        .ne { left: 100%; top: 0;    cursor: ne-resize; }
        .nw { left: 0;    top: 0;    cursor: nw-resize; }
        .se { left: 100%; top: 100%; cursor: se-resize; }
        .sw { left: 0;    top: 100%; cursor: sw-resize; }
        .link-handle.n { left: 50%; top: -18px; cursor: pointer; }
        .link-handle.s { left: 50%; top: calc(100% + 18px); cursor: pointer; }
        .link-handle.e { left: calc(100% + 18px); top: 50%; cursor: pointer; }
        .link-handle.w { left: -18px; top: 50%; cursor: pointer; }

        .chart.linking-mode,
        .chart.linking-mode .shape,
        .chart.linking-mode .content {
            cursor: crosshair;
        }

        .shape.linking {
            filter: drop-shadow(0 0 6px rgba(246, 201, 69, 0.95));
        }

        .shape.link-target {
            filter: drop-shadow(0 0 7px rgba(100, 149, 237, 0.95));
        }

        .ghost-path {
            animation: ghost-dash 0.7s linear infinite;
        }

        @keyframes ghost-dash {
            to { stroke-dashoffset: -11; }
        }

        .link-hint {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: none;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            font: 12px system-ui, sans-serif;
            pointer-events: none;
            z-index: 999;
        }

        .link-hint.show {
            display: block;
        }

        .link-picker {
            position: fixed;
            z-index: 1000;
            display: none;
            min-width: 190px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
            font: 13px system-ui, sans-serif;
            color: #0f172a;
        }

        .link-picker.open {
            display: block;
            animation: picker-pop 0.12s ease-out;
        }

        @keyframes picker-pop {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .link-picker-title,
        .link-picker-footer {
            padding: 6px 10px 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
        }

        .link-picker-footer {
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: #94a3b8;
        }

        .link-picker button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .link-picker button:hover,
        .link-picker button:focus-visible {
            background: #eef3fd;
            outline: none;
        }

        .pick-icon {
            flex: none;
            width: 28px;
            height: 20px;
            background: cornflowerblue;
        }

        .pick-icon.process { border-radius: 2px; }
        .pick-icon.decision { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); height: 24px; }
        .pick-icon.io { clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%); }
        .pick-icon.terminator { border-radius: 999px; }

        .cursor-tooltip {
            position: fixed;
            left: 0;
            top: 0;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            font: 600 11px system-ui, sans-serif;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;
            z-index: 10000;
        }

        .cursor-tooltip.show {
            opacity: 1;
        }

        .selection-box {
            position: absolute;
            display: none;
            box-sizing: border-box;
            border: 1px solid cornflowerblue;
            background: rgba(100, 149, 237, 0.12);
            pointer-events: none;
            z-index: 500;
        }

        .shape.selected {
            filter: drop-shadow(0 0 1.5px #1d4ed8) drop-shadow(0 0 3px rgba(29, 78, 216, 0.7));
        }

        /* Lines can't be grabbed while wiring up a new link — clicks must reach the canvas. */
        .chart.linking-mode .link-hit,
        .chart.linking-mode .link-turn {
            pointer-events: none !important;
        }

        .controls {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.5);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .shape-tool {
            position: relative;
            width: 90px;
            min-height: 62px;
            padding: 8px 6px 6px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #fff;
            cursor: grab;
            user-select: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .shape-tool:hover,
        .shape-tool.active {
            border-color: cornflowerblue;
            box-shadow: 0 0 0 2px rgba(100, 149, 237, 0.18);
        }

        .shape-tool:active {
            cursor: grabbing;
        }

        .mini-shape {
            position: relative;
            width: 62px;
            height: 32px;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: cornflowerblue;
            color: white;
            font-size: 9px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0.02em;
            overflow: hidden;
        }

        .mini-shape.process { border-radius: 3px; }
        .mini-shape.decision { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); height: 36px; }
        .mini-shape.io { clip-path: polygon(14% 0%, 100% 0%, 86% 100%, 0% 100%); }
        .mini-shape.terminator { border-radius: 999px; }

        .shape-tool-label {
            display: block;
            text-align: center;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
        }

        .tool-preview {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: translate(-50%, -50%);
        }

        .tool-preview .mini-shape {
            width: 80px;
            height: 40px;
            font-size: 10px;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
        }
    </style>
</head>
<body>
    <div id="shape-palette" class="controls" aria-label="Shape palette"></div>
    <div class="chart">
    </div>
    <script src="src/index.ts" type="module"></script>
</body>
</html>
